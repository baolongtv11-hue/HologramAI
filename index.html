<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice AI Hologram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --gold: #d9b873;
            --gold-light: #f6e7bd;
            --ivory: #fbf8ef;
            --emerald: #10b981;
            --indigo: #6366f1;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--black); color: var(--ivory);
            font-family: var(--font-body); font-weight: 300;
            touch-action: manipulation;
        }
        #app { position: relative; width: 100vw; height: 100vh; background: var(--black); overflow: hidden; }
        /* ===== LỚP NỘI DUNG ===== */
        #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
        #orb-container {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            z-index: 2; transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #orb-container.hidden { opacity: 0; transform: scale(0.8); pointer-events: none; }
        #orb-canvas { width: min(70vmin, 500px); height: min(70vmin, 500px); display: block; }
        #text-container {
            position: absolute; left: 8%; right: 18%; top: 12%; bottom: 12%;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 3; opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease; pointer-events: none;
        }
        #text-container.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #text-container .heading {
            font-family: var(--font-heading); font-size: clamp(24px, 4.5vmin, 48px);
            font-weight: 700; line-height: 1.15; color: var(--gold-light);
            margin-bottom: 0.4em; letter-spacing: -0.01em;
        }
        #text-container .body {
            font-size: clamp(16px, 2.8vmin, 32px); font-weight: 300; line-height: 1.5;
            color: var(--ivory); max-width: 100%; word-break: break-word; transition: font-size 0.3s ease;
        }
        #text-container .body.large { font-size: clamp(20px, 3.6vmin, 42px); }
        #text-container .body.small { font-size: clamp(14px, 2.2vmin, 24px); }
        /* ===== VIDEO LAYER ===== */
        #video-layer {
            position: absolute; inset: 0; z-index: 100; display: none;
            background: var(--black); align-items: center; justify-content: center;
        }
        #video-layer.active { display: flex; }
        #video-container { position: relative; width: 100%; height: 100%; max-width: 100%; max-height: 100%; background: #000; }
        #yt-player { position: absolute; inset: 0; width: 100%; height: 100%; }
        #yt-player iframe { width: 100% !important; height: 100% !important; }
        #subtitle-overlay { position: absolute; left: 5%; right: 5%; bottom: 8%; z-index: 101; text-align: center; pointer-events: none; }
        #subtitle-overlay .subtitle-text {
            display: inline-block; padding: 10px 24px; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 12px; font-size: clamp(16px, 2.6vmin, 28px); line-height: 1.4;
            color: var(--ivory); max-width: 90%; word-break: break-word;
            opacity: 0; transition: opacity 0.4s ease;
        }
        #subtitle-overlay .subtitle-text.visible { opacity: 1; }
        /* ===== UI ĐIỀU KHIỂN ===== */
        #controls-right {
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 12px; z-index: 200;
            transition: opacity 0.5s ease;
        }
        #controls-right.hidden { opacity: 0; pointer-events: none; }
        .ctrl-btn {
            width: 56px; height: 56px; border-radius: 50%;
            border: 1px solid rgba(217, 184, 115, 0.4);
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            color: var(--gold); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            position: relative;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .ctrl-btn svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .ctrl-btn.emergency { border-color: rgba(244, 63, 94, 0.6); color: var(--rose); }
        .ctrl-btn.emergency:active { background: rgba(244, 63, 94, 0.2); }
        .ctrl-btn.mic-active { border-color: var(--gold); background: rgba(217, 184, 115, 0.15); }
        .ctrl-btn.mic-listening { border-color: var(--indigo); background: rgba(99, 102, 241, 0.15); }
        .ctrl-btn.mic-speaking { border-color: var(--amber); background: rgba(245, 158, 11, 0.15); }
        .ctrl-btn .tooltip {
            position: absolute; right: 70px; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.8); color: var(--ivory); padding: 6px 12px;
            border-radius: 6px; font-size: 12px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .ctrl-btn:hover .tooltip { opacity: 1; }
        /* ===== STATUS BAR ===== */
        #status-bar {
            position: fixed; top: 0; left: 0; height: 3px; background: var(--gold);
            width: 0%; z-index: 300; transition: width 0.6s ease;
        }
        /* ===== OVERLAY XOAY MÀN HÌNH ===== */
        #orientation-overlay {
            position: fixed; inset: 0; background: var(--black); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
        }
        #orientation-overlay.active { display: flex; }
        #orientation-overlay .rotate-icon {
            width: 80px; height: 80px; border: 2px solid var(--gold); border-radius: 16px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
            animation: rotatePulse 2s ease-in-out infinite;
        }
        #orientation-overlay .rotate-icon svg { width: 44px; height: 44px; stroke: var(--gold); fill: none; stroke-width: 1.5; }
        @keyframes rotatePulse { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(90deg) scale(1.1); } }
        #orientation-overlay h2 { font-family: var(--font-heading); font-size: 28px; color: var(--gold-light); margin-bottom: 12px; }
        #orientation-overlay p { font-size: 16px; color: rgba(251, 248, 239, 0.7); max-width: 300px; line-height: 1.6; }
        /* ===== BOTTOM SHEET ===== */
        #bottom-sheet-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #bottom-sheet-backdrop.active { opacity: 1; pointer-events: auto; }
        #bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; max-height: 70vh;
            background: #111; border-top: 1px solid rgba(217, 184, 115, 0.3);
            border-radius: 20px 20px 0 0; z-index: 1001; padding: 24px 24px 40px;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(.2,.7,.2,1);
            display: flex; flex-direction: column; gap: 16px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        #bottom-sheet.active { transform: translateY(0); }
        #bottom-sheet h3 { font-family: var(--font-heading); font-size: 22px; color: var(--gold-light); margin-bottom: 4px; }
        #bottom-sheet label { font-size: 13px; color: rgba(251, 248, 239, 0.6); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; display: block; }
        #bottom-sheet input, #bottom-sheet select {
            width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(217, 184, 115, 0.2); border-radius: 10px;
            color: var(--ivory); font-family: var(--font-body); font-size: 16px;
            outline: none; transition: border-color 0.2s;
        }
        #bottom-sheet input:focus, #bottom-sheet select:focus { border-color: var(--gold); }
        #bottom-sheet .btn-group { display: flex; gap: 12px; margin-top: 8px; }
        #bottom-sheet .btn {
            flex: 1; padding: 14px; border-radius: 10px; border: none;
            font-family: var(--font-body); font-weight: 600; font-size: 15px;
            cursor: pointer; transition: background 0.2s, transform 0.15s;
        }
        #bottom-sheet .btn:active { transform: scale(0.97); }
        #bottom-sheet .btn.primary { background: var(--gold); color: var(--black); }
        #bottom-sheet .btn.secondary { background: rgba(255,255,255,0.08); color: var(--ivory); }
        #bottom-sheet .btn.danger { background: rgba(244, 63, 94, 0.15); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
        #bottom-sheet .error-msg { color: var(--rose); font-size: 13px; min-height: 18px; }
        #bottom-sheet .success-msg { color: var(--emerald); font-size: 13px; }
        /* ===== TRẠNG THÁI ===== */
        #state-indicator {
            position: fixed; top: 20px; left: 20px; z-index: 200;
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
            color: rgba(251, 248, 239, 0.5); transition: color 0.3s;
        }
        #state-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); transition: background 0.3s; }
        #state-indicator.listening .dot { background: var(--indigo); }
        #state-indicator.speaking .dot { background: var(--amber); }
        #state-indicator.error .dot { background: var(--rose); }
        /* ===== TOAST ===== */
        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(217, 184, 115, 0.25); color: var(--ivory);
            padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
            max-width: 80vw; text-align: center;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        /* ===== CHUYỂN CẢNH ===== */
        .transition-veil {
            position: fixed; inset: 0; z-index: 500; background: var(--black);
            pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
        }
        .transition-veil.active { opacity: 1; }
        /* ===== RESPONSIVE ===== */
        @media (orientation: portrait) { #controls-right { opacity: 0; pointer-events: none; } }
        @media (min-width: 1024px) { #controls-right { right: 40px; } .ctrl-btn { width: 64px; height: 64px; } }
    </style>
</head>
<body>
<div id="app">
    <div id="status-bar"></div>
    <div id="state-indicator">
        <span class="dot"></span>
        <span id="state-label">Chờ</span>
    </div>
    <div id="stage">
        <div id="orb-container">
            <canvas id="orb-canvas"></canvas>
        </div>
        <div id="text-container">
            <div class="heading" id="text-heading"></div>
            <div class="body" id="text-body"></div>
        </div>
    </div>
    <div id="video-layer">
        <div id="video-container">
            <div id="yt-player"></div>
        </div>
        <div id="subtitle-overlay">
            <span class="subtitle-text" id="subtitle-text"></span>
        </div>
    </div>
    <div id="controls-right">
        <button class="ctrl-btn" id="btn-mic" aria-label="Microphone">
            <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            <span class="tooltip">Micro</span>
        </button>
        <button class="ctrl-btn emergency" id="btn-stop" aria-label="Dừng khẩn cấp">
            <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            <span class="tooltip">Dừng khẩn cấp</span>
        </button>
        <button class="ctrl-btn" id="btn-mirror" aria-label="Lật gương">
            <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7l-4 5 4 5"/><path d="M16 7l4 5-4 5"/></svg>
            <span class="tooltip">Lật gương</span>
        </button>
        <button class="ctrl-btn" id="btn-settings" aria-label="Cài đặt">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="tooltip">Cài đặt</span>
        </button>
    </div>
    <div id="bottom-sheet-backdrop"></div>
    <div id="bottom-sheet">
        <h3>Cài đặt</h3>
        <div>
            <label for="input-gemini-key">Gemini API Key</label>
            <input type="password" id="input-gemini-key" placeholder="Nhập API Key từ Google AI Studio">
        </div>
        <div>
            <label for="input-youtube-key">YouTube Data API Key</label>
            <input type="password" id="input-youtube-key" placeholder="Nhập API Key từ Google Cloud Console">
        </div>
        <div>
            <label for="select-mirror">Chế độ lật gương</label>
            <select id="select-mirror">
                <option value="none">Không</option>
                <option value="vertical" selected>Dọc</option>
                <option value="horizontal">Ngang</option>
                <option value="both">Cả hai</option>
            </select>
        </div>
        <div class="error-msg" id="sheet-error"></div>
        <div class="btn-group">
            <button class="btn secondary" id="btn-sheet-cancel">Hủy</button>
            <button class="btn primary" id="btn-sheet-save">Lưu</button>
        </div>
    </div>
    <div id="orientation-overlay">
        <div class="rotate-icon">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <h2>Xoay ngang điện thoại</h2>
        <p>Vui lòng xoay thiết bị sang chế độ ngang để sử dụng chế độ trình chiếu Hologram.</p>
    </div>
    <div id="toast"></div>
    <div class="transition-veil" id="transition-veil"></div>
</div>
<script type="module">
    // ============================================================
    // CONFIG
    // ============================================================
    const CONFIG = {
        GEMINI_MODEL: 'gemini-3.8-live',
        GEMINI_WS_URL: 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent',
        YOUTUBE_SEARCH_URL: 'https://www.googleapis.com/youtube/v3/search',
        AUDIO_INPUT_RATE: 16000,
        AUDIO_OUTPUT_RATE: 24000,
        CONNECT_TIMEOUT: 10000,
        MAX_HISTORY: 200,
        STORAGE_KEYS: {
            GEMINI_KEY: 'hologram_gemini_key',
            YOUTUBE_KEY: 'hologram_youtube_key',
            MIRROR: 'hologram_mirror',
            HISTORY: 'hologram_history',
        }
    };

    // ============================================================
    // APP STATE
    // ============================================================
    const state = {
        status: 'idle',
        orbVisible: true,
        textVisible: false,
        videoActive: false,
        micActive: false,
        history: [],
        geminiKey: localStorage.getItem(CONFIG.STORAGE_KEYS.GEMINI_KEY) || '',
        youtubeKey: localStorage.getItem(CONFIG.STORAGE_KEYS.YOUTUBE_KEY) || '',
        mirrorMode: localStorage.getItem(CONFIG.STORAGE_KEYS.MIRROR) || 'vertical',
        ws: null,
        audioContext: null,
        mediaStream: null,
        ytPlayer: null,
        subtitleText: '',
        lastUserQuery: '',
        isPortrait: false,
        setupComplete: false,
        outgoingAudioCount: 0,
        incomingAudioCount: 0,
    };

    // ============================================================
    // DOM ELEMENTS
    // ============================================================
    const $ = (id) => document.getElementById(id);
    const dom = {
        orbContainer: $('orb-container'),
        orbCanvas: $('orb-canvas'),
        textContainer: $('text-container'),
        textHeading: $('text-heading'),
        textBody: $('text-body'),
        videoLayer: $('video-layer'),
        ytPlayer: $('yt-player'),
        subtitleText: $('subtitle-text'),
        statusBar: $('status-bar'),
        stateIndicator: $('state-indicator'),
        stateLabel: $('state-label'),
        btnMic: $('btn-mic'),
        btnStop: $('btn-stop'),
        btnMirror: $('btn-mirror'),
        btnSettings: $('btn-settings'),
        controlsRight: $('controls-right'),
        bottomSheet: $('bottom-sheet'),
        bottomSheetBackdrop: $('bottom-sheet-backdrop'),
        inputGeminiKey: $('input-gemini-key'),
        inputYoutubeKey: $('input-youtube-key'),
        selectMirror: $('select-mirror'),
        sheetError: $('sheet-error'),
        btnSheetCancel: $('btn-sheet-cancel'),
        btnSheetSave: $('btn-sheet-save'),
        orientationOverlay: $('orientation-overlay'),
        toast: $('toast'),
        transitionVeil: $('transition-veil'),
    };

    // ============================================================
    // LOGGER (không bao giờ log API key)
    // ============================================================
    const Log = {
        info: (...args) => console.info('[Hologram]', ...args),
        warn: (...args) => console.warn('[Hologram]', ...args),
        error: (...args) => console.error('[Hologram]', ...args),
    };

    // ============================================================
    // PERMISSION MANAGER
    // ============================================================
    const PermissionManager = {
        async requestMicrophone() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                UIEngine.showToast('Trình duyệt không hỗ trợ microphone hoặc trang không chạy trên HTTPS.');
                Log.error('mediaDevices.getUserMedia not available');
                return null;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                Log.info('Microphone granted');
                return stream;
            } catch (err) {
                Log.error('Microphone denied:', err.name, err.message);
                UIEngine.showToast('Không thể truy cập microphone. Vui lòng cấp quyền trong cài đặt trình duyệt.');
                return null;
            }
        },
    };

    // ============================================================
    // ORB ENGINE (Canvas 2D)
    // ============================================================
    const OrbEngine = {
        canvas: null,
        ctx: null,
        animId: null,
        time: 0,
        state: 'idle',
        particles: [],
        size: 300,
        init(canvas) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.createParticles(80);
            this.start();
        },
        resize() {
            if (!this.canvas) return;
            const size = Math.min(this.canvas.clientWidth, this.canvas.clientHeight);
            const dpr = window.devicePixelRatio || 1;
            this.canvas.width = size * dpr;
            this.canvas.height = size * dpr;
            this.ctx.scale(dpr, dpr);
            this.size = size;
        },
        createParticles(n) {
            this.particles = [];
            for (let i = 0; i < n; i++) {
                this.particles.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: 0.2 + Math.random() * 0.4,
                    speed: 0.001 + Math.random() * 0.003,
                    size: 1 + Math.random() * 3,
                    opacity: 0.1 + Math.random() * 0.3,
                });
            }
        },
        setState(s) { this.state = s; },
        start() {
            const loop = () => {
                this.time += 0.016;
                this.draw();
                this.animId = requestAnimationFrame(loop);
            };
            loop();
        },
        stop() { if (this.animId) cancelAnimationFrame(this.animId); },
        draw() {
            const ctx = this.ctx;
            const s = this.size || 300;
            const cx = s / 2;
            const cy = s / 2;
            const t = this.time;
            ctx.clearRect(0, 0, s, s);

            const baseR = s * 0.35;
            const breathe = 1 + Math.sin(t * 1.5) * 0.04;
            const grad = ctx.createRadialGradient(cx - s*0.1, cy - s*0.1, baseR*0.2, cx, cy, baseR*breathe);
            const colors = {
                idle: ['rgba(16, 185, 129, 0.15)', 'rgba(16, 185, 129, 0.02)'],
                listening: ['rgba(99, 102, 241, 0.2)', 'rgba(99, 102, 241, 0.02)'],
                speaking: ['rgba(245, 158, 11, 0.2)', 'rgba(245, 158, 11, 0.02)'],
                error: ['rgba(244, 63, 94, 0.2)', 'rgba(244, 63, 94, 0.02)'],
            };
            const c = colors[this.state] || colors.idle;
            grad.addColorStop(0, c[0]);
            grad.addColorStop(1, c[1]);
            ctx.beginPath();
            ctx.arc(cx, cy, baseR * breathe, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 0.6);
            coreGrad.addColorStop(0, `rgba(217, 184, 115, ${0.15 + Math.sin(t*2)*0.05})`);
            coreGrad.addColorStop(1, 'rgba(217, 184, 115, 0)');
            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = coreGrad;
            ctx.fill();

            for (let i = 0; i < 3; i++) {
                const r = baseR * (0.6 + i * 0.15 + Math.sin(t * 0.8 + i) * 0.03);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(217, 184, 115, ${0.08 - i*0.02})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            this.particles.forEach(p => {
                p.angle += p.speed;
                const x = cx + Math.cos(p.angle) * baseR * p.radius;
                const y = cy + Math.sin(p.angle) * baseR * p.radius;
                const dx = x - cx;
                const dy = y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > baseR * 0.95) return;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(246, 231, 189, ${p.opacity * (0.5 + Math.sin(t + p.angle)*0.5)})`;
                ctx.fill();
            });
        },
    };

    // ============================================================
    // AUDIO ENGINE
    // ============================================================
    const AudioEngine = {
        context: null,
        stream: null,
        source: null,
        processor: null,
        onAudioChunk: null,
        nextPlayTime: 0,
        scheduledSources: [],
        init() {
            if (!this.context) {
                this.context = new (window.AudioContext || window.webkitAudioContext)();
                Log.info('AudioContext created, sampleRate:', this.context.sampleRate);
            }
            if (this.context.state === 'suspended') {
                this.context.resume().then(() => Log.info('AudioContext resumed'));
            }
        },
        async startCapture(stream) {
            this.init();
            this.stream = stream;
            this.source = this.context.createMediaStreamSource(stream);
            // Sử dụng ScriptProcessor (ổn định trên Android Chrome)
            this.processor = this.context.createScriptProcessor(4096, 1, 1);
            this.processor.onaudioprocess = (e) => {
                if (!state.micActive || !state.setupComplete) return;
                const input = e.inputBuffer.getChannelData(0);
                const downsampled = this.downsample(input, this.context.sampleRate, CONFIG.AUDIO_INPUT_RATE);
                const int16 = this.floatTo16BitPCM(downsampled);
                if (this.onAudioChunk) this.onAudioChunk(int16);
            };
            this.source.connect(this.processor);
            this.processor.connect(this.context.destination);
            Log.info('Audio capture started');
        },
        stopCapture() {
            if (this.processor) { this.processor.disconnect(); this.processor = null; }
            if (this.source) { this.source.disconnect(); this.source = null; }
            if (this.stream) {
                this.stream.getTracks().forEach(t => t.stop());
                this.stream = null;
            }
            Log.info('Audio capture stopped');
        },
        downsample(buffer, fromRate, toRate) {
            if (fromRate === toRate) return buffer;
            const ratio = fromRate / toRate;
            const newLength = Math.round(buffer.length / ratio);
            const result = new Float32Array(newLength);
            for (let i = 0; i < newLength; i++) {
                const pos = i * ratio;
                const left = Math.floor(pos);
                const right = Math.min(left + 1, buffer.length - 1);
                result[i] = buffer[left] * (1 - (pos - left)) + buffer[right] * (pos - left);
            }
            return result;
        },
        floatTo16BitPCM(float32) {
            const buffer = new ArrayBuffer(float32.length * 2);
            const view = new DataView(buffer);
            for (let i = 0; i < float32.length; i++) {
                const s = Math.max(-1, Math.min(1, float32[i]));
                view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return buffer;
        },
        playPCMChunk(arrayBuffer) {
            this.init();
            if (!this.context) return;
            const int16 = new Int16Array(arrayBuffer);
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / 32768;
            }
            const audioBuffer = this.context.createBuffer(1, float32.length, CONFIG.AUDIO_OUTPUT_RATE);
            audioBuffer.copyToChannel(float32, 0);
            const source = this.context.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(this.context.destination);
            const now = this.context.currentTime;
            const startAt = Math.max(now + 0.03, this.nextPlayTime || 0);
            source.start(startAt);
            this.scheduledSources.push(source);
            source.onended = () => {
                const idx = this.scheduledSources.indexOf(source);
                if (idx > -1) this.scheduledSources.splice(idx, 1);
            };
            this.nextPlayTime = startAt + audioBuffer.duration;
            state.incomingAudioCount++;
            if (state.incomingAudioCount % 50 === 0) {
                Log.info('Audio chunks received:', state.incomingAudioCount);
            }
        },
        stopPlayback() {
            this.nextPlayTime = 0;
            this.scheduledSources.forEach(s => {
                try { s.stop(); } catch (e) {}
            });
            this.scheduledSources = [];
            Log.info('Audio playback stopped');
        },
    };

    // ============================================================
    // AI ENGINE (Gemini Live qua WebSocket)
    // ============================================================
    const AIEngine = {
        ws: null,
        connected: false,
        init(apiKey) {
            if (!apiKey) {
                UIEngine.showToast('Chưa có Gemini API Key. Vui lòng nhập trong Cài đặt.');
                return;
            }
            if (this.ws) this.disconnect();

            state.setupComplete = false;
            state.outgoingAudioCount = 0;
            state.incomingAudioCount = 0;

            const url = `${CONFIG.GEMINI_WS_URL}?key=${apiKey}`;
            Log.info('Connecting to Gemini Live...');
            try {
                this.ws = new WebSocket(url);
            } catch (e) {
                Log.error('WebSocket constructor error:', e);
                UIEngine.showToast('Không thể khởi tạo kết nối Gemini.');
                UIEngine.setStatus('error');
                return;
            }

            this.ws.onopen = () => {
                Log.info('WebSocket connected, sending setup...');
                this.connected = true;
                UIEngine.setStatus('connecting');
                const setup = {
                    setup: {
                        model: `models/${CONFIG.GEMINI_MODEL}`,
                        responseModalities: ['AUDIO'],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Puck' } }
                        },
                        systemInstruction: {
                            parts: [{ text: 'Bạn là trợ lý AI Hologram thông minh, trả lời bằng tiếng Việt. Hãy ngắn gọn, súc tích và hữu ích. Khi người dùng yêu cầu xem video, hãy nói rằng bạn sẽ tìm kiếm video phù hợp.' }]
                        }
                    }
                };
                this.ws.send(JSON.stringify(setup));
            };

            this.ws.onmessage = async (event) => {
                let data;
                if (event.data instanceof Blob) {
                    data = JSON.parse(await event.data.text());
                } else {
                    data = JSON.parse(event.data);
                }
                this.handleMessage(data);
            };

            this.ws.onerror = (err) => {
                Log.error('WebSocket error');
                UIEngine.showToast('Lỗi kết nối Gemini API. Kiểm tra API Key hoặc mạng.');
                UIEngine.setStatus('error');
                state.setupComplete = false;
            };

            this.ws.onclose = (event) => {
                Log.warn('WebSocket closed, code:', event.code, 'reason:', event.reason);
                this.connected = false;
                state.setupComplete = false;
                if (state.micActive) {
                    UIEngine.setStatus('error');
                    UIEngine.showToast('Kết nối Gemini đã đóng. Nhấn micro để thử lại.');
                    state.micActive = false;
                    AudioEngine.stopCapture();
                }
            };
        },
        handleMessage(msg) {
            if (msg.setupComplete) {
                Log.info('Setup complete! Ready for audio.');
                state.setupComplete = true;
                UIEngine.setStatus('listening');
                UIEngine.updateProgress(30);
                // Bây giờ mới bắt đầu gửi audio
                return;
            }

            if (msg.error) {
                Log.error('Gemini API error:', msg.error.code, msg.error.message);
                UIEngine.showToast(`Lỗi Gemini: ${msg.error.message || msg.error.code}`);
                UIEngine.setStatus('error');
                state.setupComplete = false;
                return;
            }

            if (msg.serverContent) {
                const sc = msg.serverContent;
                if (sc.interrupted) {
                    Log.info('Server interrupted');
                    AudioEngine.stopPlayback();
                }
                if (sc.modelTurn && sc.modelTurn.parts) {
                    for (const part of sc.modelTurn.parts) {
                        if (part.inlineData && part.inlineData.data) {
                            // Audio chunk
                            try {
                                const binary = atob(part.inlineData.data);
                                const bytes = new Uint8Array(binary.length);
                                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                                AudioEngine.playPCMChunk(bytes.buffer);
                                UIEngine.setStatus('speaking');
                            } catch (e) {
                                Log.error('Audio decode error:', e);
                            }
                        }
                        if (part.text) {
                            UIEngine.showText('', part.text);
                            state.lastAiText = part.text;
                        }
                    }
                }
                if (sc.turnComplete) {
                    Log.info('Turn complete');
                    if (state.status === 'speaking') {
                        UIEngine.setStatus('idle');
                        UIEngine.showOrb();
                    }
                    // Nếu mic vẫn bật, quay lại nghe
                    if (state.micActive && state.setupComplete) {
                        UIEngine.setStatus('listening');
                    }
                }
            }
        },
        sendAudio(pcmBuffer) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN && state.setupComplete) {
                try {
                    const bytes = new Uint8Array(pcmBuffer);
                    // Chia nhỏ để tránh tràn stack khi spread
                    let binary = '';
                    const chunkSize = 8192;
                    for (let i = 0; i < bytes.length; i += chunkSize) {
                        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                    }
                    const base64 = btoa(binary);
                    const msg = {
                        realtimeInput: {
                            mediaChunks: [{
                                mimeType: `audio/pcm;rate=${CONFIG.AUDIO_INPUT_RATE}`,
                                data: base64
                            }]
                        }
                    };
                    this.ws.send(JSON.stringify(msg));
                    state.outgoingAudioCount++;
                    if (state.outgoingAudioCount % 50 === 0) {
                        Log.info('Audio chunks sent:', state.outgoingAudioCount);
                    }
                } catch (e) {
                    Log.error('sendAudio error:', e);
                }
            }
        },
        sendText(text) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN && state.setupComplete) {
                const msg = {
                    clientContent: {
                        turns: [{ role: 'user', parts: [{ text }] }],
                        turnComplete: true
                    }
                };
                this.ws.send(JSON.stringify(msg));
                UIEngine.setStatus('thinking');
            }
        },
        interrupt() {
            // Gửi tín hiệu ngắt nếu có thể (một số phiên bản hỗ trợ)
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                try {
                    this.ws.send(JSON.stringify({ realtimeInput: { activityStart: {} } }));
                } catch (e) {}
            }
            AudioEngine.stopPlayback();
        },
        disconnect() {
            if (this.ws) {
                try { this.ws.close(); } catch (e) {}
                this.ws = null;
                this.connected = false;
                state.setupComplete = false;
                Log.info('Gemini disconnected');
            }
        }
    };

    // ============================================================
    // VIDEO ENGINE
    // ============================================================
    const VideoEngine = {
        player: null,
        currentVideoId: null,
        async search(query) {
            if (!state.youtubeKey) {
                UIEngine.showToast('Chưa có YouTube API Key. Vui lòng nhập trong Cài đặt.');
                return null;
            }
            const url = `${CONFIG.YOUTUBE_SEARCH_URL}?part=snippet&type=video&videoEmbeddable=true&maxResults=1&q=${encodeURIComponent(query)}&key=${state.youtubeKey}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.items && data.items.length > 0) {
                    return data.items[0].id.videoId;
                } else {
                    UIEngine.showToast('Không tìm thấy video phù hợp.');
                    return null;
                }
            } catch (err) {
                Log.error('YouTube search error:', err);
                UIEngine.showToast('Lỗi tìm kiếm video. Kiểm tra API Key hoặc kết nối mạng.');
                return null;
            }
        },
        load(videoId) {
            this.currentVideoId = videoId;
            if (!this.player) {
                window.onYouTubeIframeAPIReady = () => {
                    this.player = new YT.Player('yt-player', {
                        height: '100%',
                        width: '100%',
                        videoId: videoId,
                        playerVars: {
                            autoplay: 1,
                            mute: 1,
                            playsinline: 1,
                            rel: 0,
                            controls: 1,
                        },
                        events: {
                            onReady: (e) => e.target.playVideo(),
                            onStateChange: (e) => {
                                if (e.data === YT.PlayerState.ENDED) {
                                    UIEngine.hideVideo();
                                }
                            },
                            onError: (e) => {
                                Log.error('YouTube player error:', e.data);
                                UIEngine.showToast('Không thể phát video này.');
                                UIEngine.hideVideo();
                            }
                        }
                    });
                };
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = 'https://www.youtube.com/iframe_api';
                    document.head.appendChild(tag);
                }
            } else {
                this.player.loadVideoById(videoId);
                this.player.playVideo();
            }
        },
        stop() {
            if (this.player && this.player.stopVideo) {
                try { this.player.stopVideo(); } catch (e) {}
            }
            this.currentVideoId = null;
        }
    };

    // ============================================================
    // APP CONTROLLER
    // ============================================================
    const AppController = {
        async init() {
            OrbEngine.init(dom.orbCanvas);
            UIEngine.setStatus('idle');
            UIEngine.updateProgress(0);
            UIEngine.applyMirror();

            this.checkOrientation();
            window.addEventListener('resize', () => this.checkOrientation());
            window.addEventListener('orientationchange', () => setTimeout(() => this.checkOrientation(), 200));

            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                    Log.info('Orientation locked to landscape');
                }
            } catch (e) {
                Log.warn('Orientation lock not supported:', e.message);
            }

            this.bindEvents();
        },

        checkOrientation() {
            const isPortrait = window.innerHeight > window.innerWidth;
            state.isPortrait = isPortrait;
            if (isPortrait) {
                dom.orientationOverlay.classList.add('active');
                if (state.micActive) {
                    this.stopListening();
                }
            } else {
                dom.orientationOverlay.classList.remove('active');
            }
        },

        bindEvents() {
            dom.btnMic.addEventListener('click', () => this.toggleMic());
            dom.btnStop.addEventListener('click', () => this.emergencyStop());
            dom.btnMirror.addEventListener('click', () => this.cycleMirror());
            dom.btnSettings.addEventListener('click', () => UIEngine.showBottomSheet());
            dom.btnSheetCancel.addEventListener('click', () => UIEngine.hideBottomSheet());
            dom.btnSheetSave.addEventListener('click', () => this.saveSettings());
            dom.bottomSheetBackdrop.addEventListener('click', () => UIEngine.hideBottomSheet());

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') this.emergencyStop();
            });

            let hideTimeout;
            const showControls = () => {
                dom.controlsRight.classList.remove('hidden');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    if (!state.micActive) dom.controlsRight.classList.add('hidden');
                }, 4000);
            };
            showControls();
            document.addEventListener('touchstart', showControls);
            document.addEventListener('mousemove', showControls);
        },

        async toggleMic() {
            // Nếu đang nói, nhấn mic = ngắt lời
            if (state.status === 'speaking') {
                this.interrupt();
                return;
            }
            // Nếu đang nghe, nhấn mic = dừng
            if (state.micActive) {
                this.stopListening();
                return;
            }
            // Bắt đầu
            if (!state.geminiKey) {
                UIEngine.showToast('Vui lòng nhập Gemini API Key trong Cài đặt trước.');
                UIEngine.showBottomSheet();
                return;
            }
            const stream = await PermissionManager.requestMicrophone();
            if (!stream) return;

            state.micActive = true;
            UIEngine.setStatus('connecting');
            dom.btnMic.classList.add('mic-active');

            AudioEngine.init();
            await AudioEngine.startCapture(stream);

            // Kết nối AI nếu chưa
            if (!AIEngine.connected) {
                AIEngine.init(state.geminiKey);
            } else {
                // Đã kết nối sẵn
                state.setupComplete = true;
                UIEngine.setStatus('listening');
            }

            AudioEngine.onAudioChunk = (chunk) => {
                if (state.micActive && state.setupComplete) {
                    AIEngine.sendAudio(chunk);
                }
            };

            // Timeout nếu không nhận được setupComplete
            setTimeout(() => {
                if (state.micActive && !state.setupComplete) {
                    Log.warn('Setup timeout');
                    UIEngine.showToast('Không nhận được phản hồi từ Gemini. Kiểm tra API Key và thử lại.');
                    UIEngine.setStatus('error');
                    this.stopListening();
                }
            }, CONFIG.CONNECT_TIMEOUT);
        },

        stopListening() {
            state.micActive = false;
            AudioEngine.stopCapture();
            AIEngine.interrupt();
            UIEngine.setStatus('idle');
            UIEngine.showOrb();
            UIEngine.updateProgress(0);
            dom.btnMic.classList.remove('mic-active', 'mic-listening', 'mic-speaking');
            Log.info('Stopped listening');
        },

        interrupt() {
            AIEngine.interrupt();
            AudioEngine.stopPlayback();
            UIEngine.setStatus('idle');
            UIEngine.showOrb();
            UIEngine.updateProgress(0);
            // Nếu mic vẫn bật, quay lại nghe
            if (state.micActive && state.setupComplete) {
                UIEngine.setStatus('listening');
            }
            Log.info('Interrupted');
        },

        async handleUserSpeech(text) {
            // (Giữ nguyên phương thức này cho xử lý văn bản nếu cần,
            // nhưng hiện tại Gemini Live xử lý trực tiếp qua audio)
            state.lastUserQuery = text;
            state.history.push({ role: 'user', text, ts: Date.now() });
            if (state.history.length > CONFIG.MAX_HISTORY) state.history.shift();
        },

        emergencyStop() {
            this.stopListening();
            VideoEngine.stop();
            UIEngine.hideVideo();
            UIEngine.hideText();
            UIEngine.showOrb();
            UIEngine.setStatus('idle');
            UIEngine.updateProgress(0);
            UIEngine.showToast('Đã dừng khẩn cấp.');
            Log.info('Emergency stop');
        },

        cycleMirror() {
            const modes = ['none', 'vertical', 'horizontal', 'both'];
            const idx = modes.indexOf(state.mirrorMode);
            state.mirrorMode = modes[(idx + 1) % modes.length];
            localStorage.setItem(CONFIG.STORAGE_KEYS.MIRROR, state.mirrorMode);
            UIEngine.applyMirror();
            UIEngine.showToast(`Lật gương: ${state.mirrorMode}`);
        },

        saveSettings() {
            const geminiKey = dom.inputGeminiKey.value.trim();
            const youtubeKey = dom.inputYoutubeKey.value.trim();
            const mirror = dom.selectMirror.value;
            if (!geminiKey) {
                dom.sheetError.textContent = 'Vui lòng nhập Gemini API Key.';
                return;
            }
            state.geminiKey = geminiKey;
            state.youtubeKey = youtubeKey;
            state.mirrorMode = mirror;
            localStorage.setItem(CONFIG.STORAGE_KEYS.GEMINI_KEY, geminiKey);
            localStorage.setItem(CONFIG.STORAGE_KEYS.YOUTUBE_KEY, youtubeKey);
            localStorage.setItem(CONFIG.STORAGE_KEYS.MIRROR, mirror);
            UIEngine.applyMirror();
            UIEngine.hideBottomSheet();
            UIEngine.showToast('Đã lưu cài đặt.');
            // Ngắt kết nối cũ để dùng key mới
            AIEngine.disconnect();
        },
    };

    // ============================================================
